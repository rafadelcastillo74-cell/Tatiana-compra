
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#176b55">
<title>Mi compra · Shopping List</title>

<style>
:root {
  --bg:#f4f7f5;
  --surface:#fff;
  --text:#17231f;
  --muted:#718078;
  --line:#e5ece8;
  --primary:#176b55;
  --primary-dark:#105441;
  --soft:#eaf4ef;
  --danger:#c34b4b;
  --shadow:0 18px 50px rgba(25,55,43,.09);
}
* {box-sizing:border-box}
body {
  margin:0;
  min-height:100vh;
  padding:34px 18px;
  background:radial-gradient(circle at 10% 0%,#e6f2eb 0,transparent 34%),var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
button,input,select {font:inherit}
.app {width:min(100%,760px);margin:0 auto}
.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:28px;
}
.brand {display:flex;align-items:center;gap:12px}
.logo {
  width:46px;height:46px;
  display:grid;place-items:center;
  border-radius:15px;
  color:white;background:var(--primary);
  box-shadow:0 8px 18px #176b5533;
}
.logo svg {width:25px;height:25px}
.brand-name {font-weight:800;font-size:17px}
.brand-sub {color:var(--muted);font-size:12px;margin-top:2px}
.language {
  border:1px solid var(--line);
  background:white;color:var(--text);
  border-radius:12px;padding:10px 12px;
  cursor:pointer;outline:none;
}
.hero {margin-bottom:22px}
.eyebrow {
  color:var(--primary);font-size:11px;
  font-weight:800;text-transform:uppercase;
  letter-spacing:1.5px;margin:0 0 9px;
}
h1 {
  font-size:clamp(30px,6vw,42px);
  letter-spacing:-1.8px;line-height:1.08;margin:0;
}
.subtitle {color:var(--muted);margin:10px 0 0;line-height:1.5;font-size:14px}
.panel {
  background:var(--surface);
  border:1px solid #e9efeb;
  border-radius:22px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.add-area {padding:20px;border-bottom:1px solid var(--line)}
.add-form {display:flex;gap:10px}
.product-input {
  flex:1;min-width:0;padding:15px 16px;
  border:1px solid var(--line);
  border-radius:13px;outline:none;
  color:var(--text);background:#fbfdfc;
  transition:.2s;
}
.product-input:focus {
  border-color:var(--primary);
  box-shadow:0 0 0 3px #176b5518;
  background:white;
}
.add-btn {
  border:0;border-radius:13px;
  background:var(--primary);color:white;
  padding:0 20px;font-weight:750;
  cursor:pointer;display:flex;
  align-items:center;gap:8px;transition:.2s;
  white-space:nowrap;
}
.add-btn:hover {background:var(--primary-dark);transform:translateY(-1px)}
.summary {
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;padding:18px 22px 13px;
}
.list-title {font-weight:800;font-size:15px}
.count {color:var(--muted);font-size:12px;margin-top:4px}
.progress-wrap {padding:0 22px 17px}
.progress-track {
  height:7px;background:#edf2ef;
  border-radius:20px;overflow:hidden;
}
.progress-bar {
  height:100%;width:0;
  background:linear-gradient(90deg,#176b55,#55a887);
  border-radius:20px;transition:width .25s;
}
.progress-label {
  display:flex;justify-content:space-between;
  color:var(--muted);font-size:11px;margin-top:7px;
}
.items {list-style:none;padding:0 12px 12px;margin:0}
.item {
  display:flex;align-items:center;gap:12px;
  padding:13px 10px;
  border-top:1px solid #f0f3f1;
  border-radius:12px;
  animation:appear .18s ease-out;
}
@keyframes appear {
  from {opacity:0;transform:translateY(5px)}
  to {opacity:1;transform:translateY(0)}
}
.check {
  width:22px;height:22px;flex:0 0 22px;
  border:1.7px solid #c7d3cc;
  border-radius:7px;display:grid;
  place-items:center;background:white;
  cursor:pointer;padding:0;transition:.15s;
}
.check:hover {border-color:var(--primary)}
.check[aria-pressed="true"] {
  background:var(--primary);
  border-color:var(--primary);color:white;
}
.check svg {width:14px;height:14px}
.item-name {
  flex:1;min-width:0;font-size:14px;
  overflow-wrap:anywhere;transition:.15s;
}
.item.done .item-name {
  color:#9aa69f;text-decoration:line-through;
}
.item.done {background:#fbfcfb}
.delete-btn {
  border:0;background:transparent;
  color:#a2ada6;width:34px;height:34px;
  display:grid;place-items:center;
  border-radius:9px;cursor:pointer;transition:.15s;
}
.delete-btn:hover {color:var(--danger);background:#fff0f0}
.delete-btn svg {width:17px;height:17px}
.empty {
  padding:34px 20px 40px;
  text-align:center;color:var(--muted);
}
.empty-icon {
  width:54px;height:54px;
  display:grid;place-items:center;
  margin:0 auto 13px;
  background:var(--soft);
  color:var(--primary);border-radius:18px;
}
.empty-icon svg {width:27px;height:27px}
.empty strong {
  display:block;color:var(--text);
  font-size:14px;margin-bottom:5px;
}
.empty span {font-size:12px}
.footer {
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;
  padding:14px 21px;
  border-top:1px solid var(--line);
  color:var(--muted);font-size:11px;
}
.clear-btn {
  border:0;padding:7px 9px;
  border-radius:8px;background:transparent;
  color:var(--danger);cursor:pointer;
  font-size:11px;font-weight:700;
}
.clear-btn:hover {background:#fff0f0}
.saved {display:flex;align-items:center;gap:6px}
.saved-dot {width:6px;height:6px;background:#48a477;border-radius:50%}

@media(max-width:520px) {
  body {padding:22px 13px}
  .topbar {margin-bottom:25px}
  .add-area {padding:15px}
  .add-form {gap:7px}
  .product-input {padding:13px 12px;font-size:14px}
  .add-btn {padding:0 14px;font-size:13px}
  .summary {padding-left:17px;padding-right:17px}
  .progress-wrap {padding-left:17px;padding-right:17px}
  .footer {padding:13px 16px}
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>
<main class="app">

<header class="topbar">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 1.9-1.4L22 8H6"/>
        <circle cx="10" cy="20" r="1"/>
        <circle cx="18" cy="20" r="1"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">Mi compra</div>
      <div class="brand-sub">Shopping List · Список покупок</div>
    </div>
  </div>

  <select class="language" id="language" aria-label="Language">
    <option value="es">🇪🇸 Español</option>
    <option value="uk">🇺🇦 Українська</option>
    <option value="en">🇬🇧 English</option>
    <option value="sv">🇸🇪 Svenska</option>
  </select>
</header>

<section class="hero">
  <p class="eyebrow" data-i18n="eyebrow"></p>
  <h1 data-i18n="title"></h1>
  <p class="subtitle" data-i18n="subtitle"></p>
</section>

<section class="panel">

  <div class="add-area">
    <form class="add-form" id="addForm">
      <input class="product-input" id="productInput"
        type="text" maxlength="100" autocomplete="off"
        required>
      <button class="add-btn" type="submit">
        <span>＋</span>
        <span data-i18n="add"></span>
      </button>
    </form>
  </div>

  <div class="summary">
    <div>
      <div class="list-title" data-i18n="yourList"></div>
      <div class="count" id="countText"></div>
    </div>
    <div class="saved">
      <span class="saved-dot"></span>
      <span data-i18n="saved"></span>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-label">
      <span id="progressText"></span>
      <span id="remainingText"></span>
    </div>
  </div>

  <ul class="items" id="items" aria-live="polite"></ul>

  <div class="empty" id="emptyState">
    <div class="empty-icon">🛒</div>
    <strong data-i18n="emptyTitle"></strong>
    <span data-i18n="emptyText"></span>
  </div>

  <div class="footer">
    <span data-i18n="tip"></span>
    <button class="clear-btn" id="clearDone"
      type="button" hidden data-i18n="clearDone"></button>
  </div>

</section>
</main>

<script>
(() => {
"use strict";

const STORAGE_ITEMS = "miCompra.items.v1";
const STORAGE_LANG = "miCompra.language.v1";

const translations = {

es: {
eyebrow:"Tu compra, bajo control",
title:"Lista de la compra",
subtitle:"Añade tus productos y marca lo que ya has metido en el carro.",
add:"Añadir",
placeholder:"¿Qué necesitas comprar?",
inputLabel:"Nuevo producto",
yourList:"Tu lista",
saved:"Guardado en este dispositivo",
emptyTitle:"Tu lista está vacía",
emptyText:"Añade el primer producto para empezar.",
tip:"Toca la casilla para marcar o desmarcar.",
clearDone:"Quitar los completados",
product:"producto",
products:"productos",
completed:"completado",
pending:"pendientes",
pendingOne:"pendiente",
remove:"Eliminar",
mark:"marcar",
unmark:"desmarcar",
confirmClear:"¿Quieres quitar todos los productos marcados?",
invalid:"Escribe el nombre de un producto."
},

uk: {
eyebrow:"Покупки під контролем",
title:"Список покупок",
subtitle:"Додавайте товари та позначайте ті, що вже поклали у візок.",
add:"Додати",
placeholder:"Що потрібно купити?",
inputLabel:"Новий товар",
yourList:"Ваш список",
saved:"Збережено на цьому пристрої",
emptyTitle:"Ваш список порожній",
emptyText:"Додайте перший товар, щоб почати.",
tip:"Натискайте на позначку, щоб відмітити або зняти позначку.",
clearDone:"Видалити позначені",
product:"товар",
products:"товарів",
completed:"виконано",
pending:"залишилося",
pendingOne:"залишився",
remove:"Видалити",
mark:"позначити",
unmark:"зняти позначку",
confirmClear:"Видалити всі позначені товари?",
invalid:"Введіть назву товару."
},

en: {
eyebrow:"Your shopping, under control",
title:"Shopping List",
subtitle:"Add your products and tick off everything you've put in your cart.",
add:"Add",
placeholder:"What do you need to buy?",
inputLabel:"New product",
yourList:"Your list",
saved:"Saved on this device",
emptyTitle:"Your list is empty",
emptyText:"Add your first product to get started.",
tip:"Tap the box to check or uncheck an item.",
clearDone:"Remove completed items",
product:"product",
products:"products",
completed:"completed",
pending:"remaining",
pendingOne:"remaining",
remove:"Delete",
mark:"check",
unmark:"uncheck",
confirmClear:"Do you want to remove all checked products?",
invalid:"Enter a product name."
},

sv: {
eyebrow:"Håll koll på dina inköp",
title:"Inköpslista",
subtitle:"Lägg till produkter och markera det du redan har lagt i kundvagnen.",
add:"Lägg till",
placeholder:"Vad behöver du handla?",
inputLabel:"Ny produkt",
yourList:"Din lista",
saved:"Sparad på den här enheten",
emptyTitle:"Din lista är tom",
emptyText:"Lägg till din första produkt för att börja.",
tip:"Tryck på rutan för att markera eller avmarkera.",
clearDone:"Ta bort färdiga varor",
product:"vara",
products:"varor",
completed:"klara",
pending:"kvar",
pendingOne:"kvar",
remove:"Ta bort",
mark:"markera",
unmark:"avmarkera",
confirmClear:"Vill du ta bort alla markerade varor?",
invalid:"Ange namnet på en vara."
}

};

const $ = id => document.getElementById(id);

let language = localStorage.getItem(STORAGE_LANG) || "es";

if (!translations[language]) language = "es";

function loadItems() {
  try {
    const value = JSON.parse(
      localStorage.getItem(STORAGE_ITEMS) || "[]"
    );

    if (!Array.isArray(value)) return [];

    return value.filter(item =>
      item &&
      typeof item.id === "string" &&
      typeof item.name === "string" &&
      typeof item.done === "boolean"
    );
  } catch {
    return [];
  }
}

let items = loadItems();

function save() {
  try {
    localStorage.setItem(STORAGE_ITEMS, JSON.stringify(items));
  } catch(error) {
    console.error("Could not save shopping list:", error);
  }
}

function t(key) {
  return translations[language][key];
}

function productCount(number) {
  if (language === "es") {
    return number === 1 ? t("product") : t("products");
  }

  if (language === "en") {
    return number === 1 ? t("product") : t("products");
  }

  if (language === "sv") {
    return number === 1 ? t("product") : t("products");
  }

  const mod10 = number % 10;
  const mod100 = number % 100;

  if (mod10 === 1 && mod100 !== 11) {
    return "товар";
  }

  if (mod10 >= 2 && mod10 <= 4 &&
      !(mod100 >= 12 && mod100 <= 14)) {
    return "товари";
  }

  return "товарів";
}

function applyLanguage() {
  document.documentElement.lang = language;
  $("language").value = language;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    el.textContent = t(key);
  });

  $("productInput").placeholder = t("placeholder");
  $("productInput").setAttribute("aria-label", t("inputLabel"));

  document.title = t("title") + " · Shopping List";

  render();
}

function icon(name) {
  if (name === "check") {
    return `<svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.6"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 12 4 4L19 6"/></svg>`;
  }

  return `<svg viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/>
    </svg>`;
}

function render() {
  const list = $("items");
  list.replaceChildren();

  const total = items.length;
  const done = items.filter(item => item.done).length;
  const pending = total - done;

  const percent = total
    ? Math.round(done / total * 100)
    : 0;

  $("countText").textContent =
    `${total} ${productCount(total)}`;

  $("progressText").textContent =
    `${percent}% ${t("completed")}`;

  $("remainingText").textContent =
    `${pending} ${t("pending")}`;

  $("progressBar").style.width = `${percent}%`;

  $("emptyState").hidden = total > 0;
  $("clearDone").hidden = done === 0;

  items.forEach(item => {

    const li = document.createElement("li");
    li.className = `item${item.done ? " done" : ""}`;

    const check = document.createElement("button");
    check.type = "button";
    check.className = "check";
    check.setAttribute("aria-pressed", String(item.done));

    check.setAttribute(
      "aria-label",
      `${item.name}: ${item.done ? t("unmark") : t("mark")}`
    );

    if (item.done) {
      check.innerHTML = icon("check");
    }

    check.addEventListener("click", () => {
      item.done = !item.done;
      save();
      render();
    });

    const name = document.createElement("span");
    name.className = "item-name";
    name.textContent = item.name;

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "delete-btn";
    remove.innerHTML = icon("trash");

    remove.setAttribute(
      "aria-label",
      `${t("remove")}: ${item.name}`
    );

    remove.title = t("remove");

    remove.addEventListener("click", () => {
      items = items.filter(entry => entry.id !== item.id);
      save();
      render();
    });

    li.append(check, name, remove);
    list.append(li);
  });
}

// ADD PRODUCT
$("addForm").addEventListener("submit", event => {
  event.preventDefault();

  const input = $("productInput");
  const name = input.value.trim();

  if (!name) {
    input.setCustomValidity(t("invalid"));
    input.reportValidity();
    return;
  }

  input.setCustomValidity("");

  items.push({
    id: crypto.randomUUID
      ? crypto.randomUUID()
      : `${Date.now()}-${Math.random()}`,
    name,
    done:false
  });

  save();
  render();

  input.value = "";
  input.focus();
});

// CLEAR INPUT ERROR
$("productInput").addEventListener("input", event => {
  event.target.setCustomValidity("");
});

// REMOVE COMPLETED PRODUCTS
$("clearDone").addEventListener("click", () => {

  if (!items.some(item => item.done)) return;

  if (!window.confirm(t("confirmClear"))) return;

  items = items.filter(item => !item.done);

  save();
  render();
});

// CHANGE LANGUAGE
$("language").addEventListener("change", () => {

  language = $("language").value;

  try {
    localStorage.setItem(STORAGE_LANG, language);
  } catch(error) {
    console.error(error);
  }

  applyLanguage();
});

applyLanguage();

})();
</script>

</body>
</html>
